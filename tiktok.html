<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zurück zu Gridolu</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 30% 10%, #2b2260, #0d0b1f 70%); color: #fff; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; text-align: center; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 28px; padding: 32px 22px; }
  .flag { font-size: 52px; line-height: 1; }
  h1 { font-size: 1.6rem; margin: 14px 0 6px; }
  .score { font-size: 3rem; font-weight: 800; margin: 6px 0; background: linear-gradient(135deg, #ffc84d, #ff6b4d);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: rgba(255,255,255,0.75); line-height: 1.5; margin: 8px 0; }
  .btn { display: block; margin: 22px 0 10px; padding: 16px; border-radius: 999px; font-weight: 700; font-size: 1.1rem;
    color: #fff; text-decoration: none; background: linear-gradient(135deg, #ffc84d, #ff6b4d); }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 1.4rem; letter-spacing: 3px; font-weight: 700;
    background: rgba(255,255,255,0.1); border-radius: 14px; padding: 10px; margin: 8px 0 4px; user-select: all; }
  .small { font-size: 0.85rem; color: rgba(255,255,255,0.55); }
  a.link { color: #9fd0ff; }
</style>
</head>
<body>
<div class="card">
  <div class="flag">🎬</div>
  <h1>Danke fürs Teilen!</h1>
  <p>Dein Gridolu-Video ist bei TikTok angekommen. <span lang="en">Thanks for sharing – your Gridolu video is on its way to TikTok.</span></p>
  <a class="btn" href="gridolu://">Zurück zu Gridolu</a>
  <p class="small"><a class="link" href="https://apps.apple.com/app/id6827134157">Gridolu im App Store</a></p>
</div>
</body>
</html>
